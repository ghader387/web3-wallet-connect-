name: Wallet Deposit Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: wallet-monitor
  cancel-in-progress: false

jobs:
  check-deposits:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Check wallet deposits
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          CHT_ID: ${{ secrets.CHT_ID }}
          WALLET_ADDRESS: ${{ vars.WALLET_ADDRESS }}
          TRONGRID_API_KEY: ${{ secrets.TRONGRID_API_KEY }}
        run: python monitor.py

      - name: Save state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add state.json
          git rm -q --cached --ignore-unmatch last_tx.txt
          if [ -n "$(git status --porcelain state.json last_tx.txt)" ]; then
            git commit -m "Update wallet monitor state [skip ci]"
            git pull --rebase -q || true
            git push
          fi
