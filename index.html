<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اولین پروژه Web3 من</title>
    <style>
        /* استایل‌دهی به صفحه */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2e; /* رنگ پس‌زمینه تیره */
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        h1 {
            color: #cba6f7;
        }
        /* استایل دکمه اتصال */
        button {
            padding: 15px 30px;
            font-size: 18px;
            background-color: #f6851b; /* رنگ نارنجی متامسک */
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            margin-top: 20px;
        }
        button:hover {
            background-color: #e2761b;
            transform: scale(1.05);
        }
        button:disabled {
            background-color: #28a745; /* رنگ سبز وقتی متصل شد */
            cursor: not-allowed;
            transform: none;
        }
        /* استایل کادری که آدرس ولت را نشان می‌دهد */
        #walletAddress {
            margin-top: 20px;
            padding: 15px;
            background-color: #313244;
            border-radius: 8px;
            font-family: monospace;
            direction: ltr; /* چون آدرس‌ها انگلیسی هستند */
            display: none; /* اولش مخفی است */
            word-break: break-all;
        }
    </style>
</head>
<body>

    <h1>به دنیای Web3 خوش آمدید 🚀</h1>
    <p>برای شروع، کیف پول خود را متصل کنید.</p>
    
    <!-- دکمه اتصال -->
    <button id="connectBtn">اتصال کیف پول (Connect Wallet)</button>
    
    <!-- جایی برای نمایش آدرس ولت -->
    <div id="walletAddress"></div>

    <script>
        // پیدا کردن المان‌های HTML در جاوا اسکریپت
        const connectBtn = document.getElementById('connectBtn');
        const walletAddressDiv = document.getElementById('walletAddress');

        // وقتی روی دکمه کلیک شد، این کد اجرا می‌شود
        connectBtn.addEventListener('click', async () => {
            
            // بررسی اینکه آیا افزونه متامسک در مرورگر نصب است یا خیر
            if (typeof window.ethereum !== 'undefined') {
                try {
                    // درخواست اتصال از متامسک
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    
                    // گرفتن آدرس کیف پول کاربر (اولین اکانت)
                    const account = accounts[0];
                    
                    // نمایش آدرس در صفحه
                    walletAddressDiv.style.display = 'block';
                    walletAddressDiv.innerHTML = `✅ کیف پول متصل شد:<br><b>${account}</b>`;
                    
                    // تغییر ظاهر دکمه بعد از اتصال
                    connectBtn.innerText = "متصل شد!";
                    connectBtn.disabled = true;

                } catch (error) {
                    // اگر کاربر اتصال را لغو کرد
                    console.error("کاربر اتصال را رد کرد یا خطایی رخ داد", error);
                    alert("شما اتصال را لغو کردید یا خطایی رخ داد.");
                }
            } else {
                // اگر متامسک نصب نبود
                alert("لطفاً ابتدا افزونه MetaMask را روی مرورگر خود نصب کنید!");
            }
        });
    </script>
</body>
</html>
