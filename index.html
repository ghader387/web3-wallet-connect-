<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد کامل Web3</title>
    
    <!-- کتابخانه Ethers.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2e;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
            text-align: center;
        }
        h1 { color: #cba6f7; margin-bottom: 10px; }
        p { color: #a6adc8; }
        
        .card {
            background-color: #313244;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            border: 1px solid #45475a;
        }

        button {
            padding: 15px;
            font-size: 16px;
            background-color: #f6851b;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            width: 100%;
            margin-top: 20px;
        }
        button:hover { background-color: #e2761b; }
        button:disabled { background-color: #28a745; cursor: not-allowed; }
        
        .info-box {
            display: none;
            margin-top: 25px;
            text-align: right;
        }
        .info-row {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #45475a;
        }
        .info-row:last-child { border-bottom: none; margin-bottom: 0;}
        .label { color: #a6adc8; font-size: 13px; display: block; margin-bottom: 5px;}
        .value { font-family: monospace; font-size: 15px; color: #89b4fa; word-break: break-all; direction: ltr; display: block;}
        .balance-value { color: #a6e3a1; font-weight: bold; font-size: 18px; }
        
        #txStatus { margin-top: 15px; font-size: 14px; color: #f9e2af; display: none; }
    </style>
</head>
<body>

    <h1>داشبورد Web3 🚀</h1>
    <p>تست اتصال، موجودی و تراکنش</p>
    
    <div class="card">
        <button id="connectBtn">اتصال کیف پول</button>
        
        <div id="walletInfo" class="info-box">
            <div class="info-row">
                <span class="label">آدرس:</span>
                <span id="walletAddress" class="value">...</span>
            </div>
            <div class="info-row">
                <span class="label">شبکه:</span>
                <span id="networkName" class="value">...</span>
            </div>
            <div class="info-row">
                <span class="label">موجودی:</span>
                <span id="walletBalance" class="value balance-value">...</span>
            </div>
            
            <button id="sendTxBtn" style="background-color: #89b4fa; margin-top: 10px;">ارسال 0.001 اتریوم (تست)</button>
            <div id="txStatus"></div>
        </div>
    </div>

    <script>
        const connectBtn = document.getElementById('connectBtn');
        const walletInfo = document.getElementById('walletInfo');
        const walletAddressSpan = document.getElementById('walletAddress');
        const networkNameSpan = document.getElementById('networkName');
        const walletBalanceSpan = document.getElementById('walletBalance');
        const sendTxBtn = document.getElementById('sendTxBtn');
        const txStatus = document.getElementById('txStatus');

        let currentAccount = null;

        connectBtn.addEventListener('click', async () => {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    currentAccount = accounts[0];
                    
                    const provider = new ethers.BrowserProvider(window.ethereum);
                    const network = await provider.getNetwork();
                    
                    const balanceWei = await provider.getBalance(currentAccount);
                    const balanceEther = ethers.formatEther(balanceWei);
                    
                    walletInfo.style.display = 'block';
                    walletAddressSpan.innerText = currentAccount;
                    networkNameSpan.innerText = network.name + " (Chain: " + network.chainId + ")";
                    walletBalanceSpan.innerText = parseFloat(balanceEther).toFixed(4) + " ETH";
                    
                    connectBtn.innerText = "کیف پول متصل است";
                    connectBtn.disabled = true;

                } catch (error) {
                    console.error(error);
                    alert("خطا در اتصال! آیا اتصال را لغو کردید؟");
                }
            } else {
                alert("لطفاً ابتدا MetaMask را نصب کنید!");
            }
        });

        sendTxBtn.addEventListener('click', async () => {
            if (!currentAccount) return;
            
            try {
                txStatus.style.display = 'block';
                txStatus.innerText = "در حال ارسال تراکنش... لطفا در متامسک تایید کنید.";
                
                const provider = new ethers.BrowserProvider(window.ethereum);
                const signer = await provider.getSigner();
                
                const tx = await signer.sendTransaction({
                    to: currentAccount,
                    value: ethers.parseEther("0.001")
                });
                
                txStatus.innerText = "تراکنش ارسال شد! در انتظار تایید...";
                
                await tx.wait();
                txStatus.innerText = "✅ تراکنش تایید شد! هش: " + tx.hash.substring(0, 10) + "...";
                txStatus.style.color = "#a6e3a1";
                
            } catch (error) {
                console.error(error);
                txStatus.innerText = "❌ تراکنش لغو شد یا خطا داد.";
                txStatus.style.color = "#f38ba8";
            }
        });
    </script>
</body>
</html>
