<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>درگاه پرداخت KitchenGo</title>
    
    <script src="https://cdn.jsdelivr.net/npm/tronweb@5.3.2/dist/TronWeb.min.js"></script>

    <style>
        /* همان استایل‌های قبلی (برای کوتاه شدن کد حذف شدند، از نسخه قبلی که داری استفاده کن) */
        /* اما برای اطمینان، یک استایل مینیمال اینجا گذاشتم */
        body { font-family: Tahoma, sans-serif; background-color: #0f172a; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background-color: #1e293b; padding: 30px; border-radius: 15px; text-align: center; width: 90%; max-width: 400px; border: 1px solid #334155; }
        .amount-box { font-size: 36px; color: #4ade80; font-weight: bold; margin: 15px 0; font-family: monospace;}
        .qr-container { background: white; padding: 10px; border-radius: 10px; display: inline-block; margin-bottom: 20px;}
        .address-box { font-family: monospace; background: #0f172a; padding: 12px; border-radius: 8px; color: #94a3b8; font-size: 12px; margin-bottom: 20px; word-break: break-all; cursor: pointer;}
        .status-box { padding: 15px; border-radius: 10px; background: #334155; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 10px;}
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #38bdf8; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .success-box { display: none; background-color: #065f46; color: #34d399; padding: 20px; border-radius: 10px; font-size: 18px; font-weight: bold; border: 1px solid #34d399; }
    </style>
</head>
<body>

    <div class="card">
        <h2>💳 پرداخت لایسنس KitchenGo</h2>
        <p style="color: #94a3b8; font-size: 13px;">شماره سفارش: <span id="orderIdDisplay">---</span></p>
        
        <!-- مبلغ دقیق از URL خوانده می‌شود -->
        <div class="amount-box" id="amountDisplay">0.00 USDT</div>
        <p style="color: #94a3b8; font-size: 13px;">(شبکه: Tron - TRC20)</p>
        <p style="color: #fbbf24; font-size: 11px; margin-top: -10px; margin-bottom: 15px;">* لطفاً دقیقاً همین مبلغ را واریز کنید</p>

        <div class="qr-container">
           <img id="qrCode" src="" alt="QR Code">
        </div>

        <p style="font-size: 13px; color: #cbd5e1;">آدرس کیف پول:</p>
        <div class="address-box" id="walletAddress" onclick="copyAddress()">
            TXU41F4Y1TkUggM7SX589abP7HCfnyvTt1
        </div>

        <div class="status-box" id="waitingStatus">
            <div class="loader"></div>
            <span>در انتظار پرداخت...</span>
        </div>

        <div class="success-box" id="successStatus">
            ✅ پرداخت با موفقیت دریافت شد!
        </div>
    </div>

    <script>
        // --- تنظیمات ---
        const myWalletAddress = "TXU41F4Y1TkUggM7SX589abP7HCfnyvTt1";
        const usdtContractAddress = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
        
        // ۱. خواندن اطلاعات از URL (مثلاً: index.html?order=1024&amount=50.12)
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('order') || 'TEST-000';
        const amountToPay = parseFloat(urlParams.get('amount')) || 50.00; // اگر مبلغی در URL نبود، ۵۰ دلار پیش‌فرض

        // نمایش اطلاعات در صفحه
        document.getElementById('orderIdDisplay').innerText = orderId;
        document.getElementById('amountDisplay').innerText = amountToPay.toFixed(2) + " USDT";
        document.getElementById('qrCode').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${myWalletAddress}`;

        // ۲. ذخیره زمان شروع در حافظه مرورگر (تا با رفرش پاک نشود)
        let startTime = localStorage.getItem('startTime_' + orderId);
        if (!startTime) {
            startTime = Date.now();
            localStorage.setItem('startTime_' + orderId, startTime);
        }

        function copyAddress() {
            navigator.clipboard.writeText(myWalletAddress);
            alert("آدرس کپی شد!");
        }

        const tronWeb = new TronWeb({ fullHost: 'https://api.trongrid.io' });

        async function checkPayment() {
            try {
                const response = await fetch(`https://api.trongrid.io/v1/accounts/${myWalletAddress}/transactions/trc20?limit=20&contract_address=${usdtContractAddress}`);
                const data = await response.json();

                if (data.data && data.data.length > 0) {
                    for (let tx of data.data) {
                        // بررسی اینکه تراکنش جدید است
                        if (tx.block_timestamp > startTime) {
                            const amountReceived = Number(tx.value) / 1000000;
                            
                            // ۳. بررسی تطبیق دقیق مبلغ (با اختلاف 0.01 برای خطای شبکه)
                            // یعنی اگر مبلغ واریزی برابر با 50.12 باشد
                            if (Math.abs(amountReceived - amountToPay) < 0.01 && tx.to === myWalletAddress) {
                                
                                // تغییر وضعیت به موفقیت
                                document.getElementById('waitingStatus').style.display = 'none';
                                document.getElementById('successStatus').style.display = 'block';
                                
                                // پاک کردن زمان شروع از حافظه
                                localStorage.removeItem('startTime_' + orderId);
                                clearInterval(paymentInterval);
                                
                                // در اینجا می‌توانیم کاربر را به سایت اصلی برگردانیم
                                setTimeout(() => {
                                    // مثال: window.location.href = `https://kitchengo.ir/cabinet?payment=success&order=${orderId}`;
                                }, 3000);
                                return;
                            }
                        }
                    }
                }
            } catch (error) {
                console.error("خطا در بررسی پرداخت:", error);
            }
        }

        const paymentInterval = setInterval(checkPayment, 10000);
    </script>
</body>
</html>
