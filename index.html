<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کیف‌پول من · واریزی‌ها</title>
<style>
  body { font-family: Tahoma, 'Segoe UI', sans-serif; background:#0f172a; color:#e2e8f0; margin:0; padding:24px 12px; display:flex; justify-content:center; }
  .wrap { width:100%; max-width:560px; }
  .card { background:#1e293b; border:1px solid #334155; border-radius:14px; padding:22px; margin-bottom:16px; }
  h1 { font-size:20px; color:#38bdf8; margin:0 0 4px; }
  .muted { color:#94a3b8; font-size:12px; }
  .badge { background:#ef4444; color:#fff; padding:3px 10px; border-radius:20px; font-size:11px; }
  .balance { font-size:36px; color:#4ade80; font-weight:bold; font-family:monospace; margin:10px 0 4px; }
  .addr { font-family:monospace; background:#0f172a; border:1px dashed #475569; border-radius:8px; padding:10px; font-size:12px; word-break:break-all; cursor:pointer; direction:ltr; text-align:center; }
  .qr { background:#fff; border-radius:10px; padding:10px; display:inline-block; margin:12px 0; }
  .qr img { width:150px; height:150px; display:block; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { padding:8px 6px; border-bottom:1px solid #334155; text-align:right; }
  td.amt { color:#4ade80; font-family:monospace; white-space:nowrap; }
  td.from { font-family:monospace; font-size:11px; direction:ltr; }
  a { color:#38bdf8; text-decoration:none; }
  .row { display:flex; justify-content:space-between; align-items:center; }
  button { background:#334155; color:#e2e8f0; border:0; border-radius:8px; padding:6px 12px; cursor:pointer; font-family:inherit; }
  .center { text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card center">
    <h1>👛 کیف‌پول من</h1>
    <span class="badge">TRON · USDT TRC-20</span>
    <div class="balance" id="balance">…</div>
    <div class="muted">موجودی USDT · <span id="trx"></span></div>
    <div class="qr"><img id="qr" alt="QR"></div>
    <div class="addr" id="addr" title="برای کپی کلیک کنید"></div>
    <div class="muted" style="margin-top:8px">فقط‌خواندنی؛ این صفحه به هیچ کلید یا امضایی دسترسی ندارد.</div>
  </div>

  <div class="card">
    <div class="row">
      <strong>آخرین واریزها</strong>
      <button onclick="load()">به‌روزرسانی</button>
    </div>
    <div class="muted" id="updated" style="margin:6px 0 10px"></div>
    <table>
      <thead><tr><th>زمان</th><th>مبلغ</th><th>از</th><th></th></tr></thead>
      <tbody id="rows"><tr><td colspan="4" class="muted">در حال بارگذاری…</td></tr></tbody>
    </table>
  </div>
</div>

<script>
  // آدرس پیش‌فرض کیف‌پول؛ برای نمایش کیف‌پول دیگر: ?wallet=T...
  const DEFAULT_WALLET = "TXU41F4Y1TkUggM7SX589abP7HCfnyvTt1";
  const USDT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
  const API = "https://api.trongrid.io";

  const q = new URLSearchParams(location.search).get("wallet");
  const WALLET = q && /^T[1-9A-HJ-NP-Za-km-z]{33}$/.test(q) ? q : DEFAULT_WALLET;

  const $ = (id) => document.getElementById(id);
  $("addr").textContent = WALLET;
  $("qr").src = "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=" + encodeURIComponent(WALLET);
  $("addr").onclick = () => navigator.clipboard.writeText(WALLET).then(() => alert("آدرس کپی شد"));

  const fmt = (n) => n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const short = (a) => a.slice(0, 6) + "…" + a.slice(-4);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  async function load() {
    try {
      const [accRes, txRes] = await Promise.all([
        fetch(`${API}/v1/accounts/${WALLET}`),
        fetch(`${API}/v1/accounts/${WALLET}/transactions/trc20?limit=20&only_to=true&only_confirmed=true&contract_address=${USDT}`),
      ]);
      const acc = ((await accRes.json()).data || [])[0] || {};
      let usdt = 0;
      for (const t of acc.trc20 || []) if (t[USDT]) usdt = Number(t[USDT]) / 1e6;
      $("balance").textContent = fmt(usdt);
      $("trx").textContent = "TRX: " + fmt((acc.balance || 0) / 1e6);

      const txs = ((await txRes.json()).data || []).filter((t) => t.to === WALLET);
      $("rows").innerHTML = txs.length
        ? txs.map((t) => `<tr>
            <td>${new Date(t.block_timestamp).toLocaleString("fa-IR")}</td>
            <td class="amt">+${fmt(Number(t.value) / 10 ** (t.token_info?.decimals ?? 6))}</td>
            <td class="from">${esc(short(t.from))}</td>
            <td><a target="_blank" rel="noopener" href="https://tronscan.org/#/transaction/${esc(t.transaction_id)}">جزئیات</a></td>
          </tr>`).join("")
        : `<tr><td colspan="4" class="muted">هنوز واریزی ثبت نشده.</td></tr>`;
      $("updated").textContent = "آخرین بررسی: " + new Date().toLocaleTimeString("fa-IR");
    } catch (e) {
      $("updated").textContent = "خطا در اتصال به شبکه؛ دوباره تلاش کنید.";
      console.error(e);
    }
  }
  load();
  setInterval(load, 30000);
</script>
</body>
</html>
