<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پرداخت امن - KitchenGo</title>
    
    <script src="https://cdn.jsdelivr.net/npm/tronweb@5.3.2/dist/TronWeb.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #334155;
            width: 90%;
            max-width: 400px;
        }
        h2 { color: #38bdf8; margin-top: 0; }
        
        .amount-box {
            font-size: 32px;
            font-weight: bold;
            color: #4ade80;
            margin: 15px 0;
            font-family: monospace;
        }

        .qr-container {
            background-color: white;
            padding: 10px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 15px;
        }
        .qr-container img { width: 180px; height: 180px; }

        .address-box {
            font-family: monospace;
            background-color: #0f172a;
            padding: 12px;
            border-radius: 8px;
            direction: ltr;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 20px;
            word-break: break-all;
            cursor: pointer;
            border: 1px dashed #475569;
        }
        .address-box:hover { background-color: #1e293b; }

        .status-box {
            padding: 15px;
            border-radius: 10px;
            background-color: #334155;
            margin-bottom: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #38bdf8;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .success-box {
            display: none;
            background-color: #065f46;
            color: #34d399;
            padding: 20px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            border: 1px solid #34d399;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>💳 پرداخت لایسنس KitchenGo</h2>
        
        <div class="amount-box" id="amountDisplay">50.00 USDT</div>
        <p style="color: #94a3b8; font-size: 13px;">(شبکه: Tron - TRC20)</p>

        <div class="qr-container">
           <img id="qrCode" src="" alt="QR Code">
        </div>

        <p style="font-size: 13px; color: #cbd5e1;">آدرس کیف پول (برای کپی کلیک کنید):</p>
        <div class="address-box" id="walletAddress" onclick="copyAddress()">
            TXU41F4Y1TkUggM7SX589abP7HCfnyvTt1
        </div>

        <!-- وضعیت در انتظار -->
        <div class="status-box" id="waitingStatus">
            <div class="loader"></div>
            <span>در انتظار پرداخت...</span>
        </div>

        <!-- وضعیت موفقیت -->
        <div class="success-box" id="successStatus">
            ✅ پرداخت با موفقیت دریافت شد!<br>
            <span style="font-size: 14px; font-weight: normal; margin-top: 5px; display: inline-block;">سفارش شما در حال پردازش است.</span>
        </div>
    </div>

    <script>
        // --- تنظیمات فروشگاه ---
        const myWalletAddress = "TXU41F4Y1TkUggM7SX589abP7HCfnyvTt1";
        const usdtContractAddress = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
        const requiredAmount = 50; // مبلغی که باید واریز شود (به تتر)
        
        // زمان شروع صفحه (برای اینکه تراکنش‌های قدیمی را حساب نکند)
        const startTime = Date.now();

        // تنظیم کیو آر کد
        document.getElementById('qrCode').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${myWalletAddress}`;

        // کپی کردن آدرس
        function copyAddress() {
            navigator.clipboard.writeText(myWalletAddress);
            alert("آدرس کپی شد!");
        }

        const tronWeb = new TronWeb({
            fullHost: 'https://api.trongrid.io'
        });

        async function checkPayment() {
            try {
                // استفاده از API ترون گرید برای گرفتن آخرین تراکنش‌های این آدرس
                const response = await fetch(`https://api.trongrid.io/v1/accounts/${myWalletAddress}/transactions/trc20?limit=5&contract_address=${usdtContractAddress}`);
                const data = await response.json();

                if (data.data && data.data.length > 0) {
                    for (let tx of data.data) {
                        // بررسی اینکه تراکنش مربوط به بعد از باز شدن این صفحه است
                        if (tx.block_timestamp > startTime) {
                            // تبدیل واحد تتر
                            const amountReceived = Number(tx.value) / 1000000;
                            
                            // بررسی اینکه آیا مبلغ واریزی برابر یا بیشتر از مبلغ درخواستی است
                            if (amountReceived >= requiredAmount && tx.to === myWalletAddress) {
                                // تغییر وضعیت به موفقیت
                                document.getElementById('waitingStatus').style.display = 'none';
                                document.getElementById('successStatus').style.display = 'block';
                                
                                // قطع کردن چک کردن‌های بعدی
                                clearInterval(paymentInterval);
                                return;
                            }
                        }
                    }
                }
            } catch (error) {
                console.error("خطا در بررسی پرداخت:", error);
            }
        }

        // هر ۱۰ ثانیه یکبار چک می‌کند
        const paymentInterval = setInterval(checkPayment, 10000);

    </script>
</body>
</html>
